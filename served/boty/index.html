<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bot-y</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36;
    --fg: #e6e9ef; --dim: #8b93a3;
    --ok: #3fb950; --off: #6e7681; --warn: #d29922; --bad: #f85149;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --fg:#1c2128; --dim:#5b6472; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  header { display: flex; align-items: baseline; gap: .6rem; margin-bottom: 1rem; }
  h1 { font-size: 1.15rem; margin: 0; letter-spacing: -.01em; }
  .age { color: var(--dim); font-size: .82rem; }
  .banner {
    padding: .7rem .85rem; border-radius: 9px; margin-bottom: 1rem;
    font-size: .88rem; border: 1px solid transparent;
  }
  .banner.ok  { background: color-mix(in srgb, var(--ok) 12%, transparent);  border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
  .banner.bad { background: color-mix(in srgb, var(--warn) 14%, transparent); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
  li {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: .7rem .85rem; display: grid; grid-template-columns: auto 1fr auto; gap: .7rem;
    align-items: center;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
  .dot.in_stock { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.unknown  { background: var(--warn); }
  .name { font-weight: 560; }
  a.name { color: inherit; text-decoration: none; }
  a.name:hover { text-decoration: underline; }
  .meta { color: var(--dim); font-size: .78rem; margin-top: .15rem; word-break: break-word; }
  .price { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .tag {
    font-size: .64rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); border: 1px solid var(--line); border-radius: 5px;
    padding: .05rem .3rem; margin-left: .4rem; vertical-align: 1px;
  }
  /* Deliberately louder than a plain .tag. `control` is an ordinary label and
     should recede; `degraded` is a claim about how much the number beside it is
     worth — it was read by executing the retailer's JavaScript, with no
     response status to check it against. Styled like everything else, it would
     be a word rather than a warning. */
  .tag.degraded { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  /* `degraded` says discount this reading; `dom` says why. The flag has two
     disjuncts now — a browser transport OR a presentation-markup read — and a
     row showing only the derived flag cannot tell a reader whether to expect a
     slow page or a parser that a reskin will break without anything going red. */
  .tag.dom { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  /* The store this reading is ABOUT, at two weights, drawing the same
     label-versus-warning distinction as `control` and `degraded` above.
     A store that matches the pin is an ordinary label and recedes: the reading
     is about the place you asked about, which is the expected case. An unpinned
     or mismatched store is a warning, because the row is then a statement about
     somewhere else — a price and an availability from a shop that is not yours,
     rendered exactly like one that is. That is not lower confidence, it is a
     different question, which is why it is loud rather than dim. */
  .tag.store { color: var(--dim); border-color: var(--line); }
  .tag.store.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  /* HOW OLD THIS READING IS, at the same two weights, drawing the same
     label-versus-warning distinction as `control`/`degraded` and
     `store`/`store.warn` above — third application.
     A reading younger than the cadence its OWN retailer is currently on is an
     ordinary label and recedes: the monitor is doing exactly what it should. A
     reading older than that cadence, and a reading nobody dated, are warnings,
     because both are the row saying something different from what it appears to
     say.

     THE BANNER'S 1 800-SECOND CONSTANT IS NOT THIS THRESHOLD AND MUST NOT BE
     MERGED WITH IT. It asks *is this snapshot being written?*; this tag asks *is
     this reading younger than its own retailer's current cadence?* The
     arithmetic, not just the principle: target and walmart sit on the
     21 600-second cap while they are refusing us, so 1 800 would paint every one
     of their rows stale while they behave exactly as the politeness rule
     requires; and gamestop runs on a 900-second override, so 1 800 would call a
     25-minute-old GameStop reading fresh when its own pacing says it is
     overdue. ONE CONSTANT, WRONG IN BOTH DIRECTIONS ON THE SAME PAGE IN THE
     SAME SECOND.

     So the banner's constant stays exactly where it is, unmoved and unreused,
     and `tests/test_dashboard.py` asserts the digits occur on this page exactly
     ONCE. That is why this paragraph writes the number with a space: the test
     counts over the whole file and cannot tell prose from code, so an unspaced
     numeral here would make the assertion fail on its own explanation. Do not
     "tidy" the spacing. */
  .tag.age { color: var(--dim); border-color: var(--line); }
  .tag.age.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  footer { margin-top: 1.1rem; color: var(--dim); font-size: .76rem; }
</style>
</head>
<body>
<header><h1>bot-y</h1><span class="age" id="age">loading…</span></header>
<div id="banner"></div>
<ul id="list"></ul>
<footer>Controls are known-in-stock products. If one stops reading green, the detector is broken — not the market.</footer>

<script>
// The three bands now have ONE home. The row tag needs the same bands for a
// CADENCE, where `" ago"` would be false — a threshold is not a time in the
// past — so `fmtDur` holds the bands and `fmtAge` is defined through it rather
// than copied beside it. `Result.degraded`'s one-source-of-truth argument, on a
// template: two formatters drift, and the banner and the row tag must not start
// disagreeing about what "3h" means.
//
// `fmtAge`'s output is UNCHANGED for every input — same bands, same coercions,
// same suffix — so the banner's sentence below is byte-identical to what it
// printed before.
const fmtDur = s => s < 90 ? `${s|0}s` : s < 5400 ? `${(s/60)|0}m` : `${(s/3600)|0}h`;
const fmtAge = s => `${fmtDur(s)} ago`;

// Everything below builds HTML by interpolation and assigns it to innerHTML,
// and not all of it is ours. `w.detail` is `"<source>: <availability> from
// <seller>"` — both halves lifted verbatim out of the retailer's own JSON-LD by
// boty.retailers, carried through status.json, and rendered here. With
// `first_party_only: false` (a supported, documented, tested setting) any
// marketplace seller's display name lands in that string; `raw_availability` is
// unbounded either way. A seller who names their store
// `<img src=x onerror=...>` would otherwise get script execution on THIS origin
// — which, behind Mission Control's /tools/boty proxy, is Mission Control's,
// not an isolated one.
//
// So: escape once, at the sink, and apply it to every interpolated value rather
// than to the ones currently known to be attacker-reachable. Operator-controlled
// fields go through it too. A rule of the form "these three but not those two"
// does not survive the next edit to this template.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Which store the reading is about. Two values, because one cannot tell "no
// store recorded" apart from "store B answered and you pinned A" — and those
// are the two states this tag exists to distinguish. `store` is what the page
// said answered; `store_pinned` is what the operator configured. Either can be
// null, and a watch with neither renders nothing at all: five of the six
// retailers here never publish a store, and their rows must stay clean.
//
// Both values go through `esc()`. `w.store` is whatever string Walmart put in
// its own hydration payload, of any length or content; `w.store_pinned` is the
// operator's, and it is escaped too because the rule on this page is "escape
// once, at the sink, and apply it to every interpolated value" — not "these
// three but not those two".
//
// AND A ROW NOBODY READ MAKES NO CLAIM ABOUT A PAGE AT ALL, which is the first
// line of the function. The two states above are both statements about a
// READING; a row with no reading is in neither, so rendering it in either is
// exactly the conflation this phase exists to remove. On a remembered row
// `store` is always null — the ledger holds no store — so such a row could only
// ever reach the pinned-but-unanswered warn branch, whose sentence says the page
// did not name its store on a row where there was no page. True in the letter,
// false in register. 07-04 measured that it fires the moment WALMART_STORE_ID is
// set, which is the open question 07-06's checkpoint puts in front of the
// operator.
//
// `=== false` and not `!w.checked`, because a pre-07-04 status.json sitting on
// disk during a deploy has no `checked` key at all and `!undefined` is `true`,
// which would silently suppress the store tag on every row of that file.
const storeTag = w => {
  if (w.checked === false) return '';
  const answered = w.store ?? null, pinned = w.store_pinned ?? null;
  if (answered === null && pinned === null) return '';
  if (answered === null)
    return `<span class="tag store warn" title="this watch is pinned to a store, but the page did not say which store answered — the reading may be about somewhere else">store ? · pinned ${esc(pinned)}</span>`;
  if (pinned === null)
    return `<span class="tag store warn" title="the page says this store answered, and no store is pinned for this watch — the reading is about whichever location the retailer picked, not one you chose">store ${esc(answered)} · unpinned</span>`;
  if (answered !== pinned)
    return `<span class="tag store warn" title="a different store answered than the one pinned for this watch — the price and availability beside this are about that other store">store ${esc(answered)} ≠ pinned ${esc(pinned)}</span>`;
  return `<span class="tag store" title="the store that answered is the store pinned for this watch — this reading is about the place you asked about">store ${esc(answered)}</span>`;
};

// HOW OLD THIS READING IS, in the same four forms `boty check` prints, so a
// reader comparing the two surfaces never has to translate:
//
//     4s ago              cli: [age 4s]
//     7h ago > 6h         cli: [age 7h > 6h]
//     3h ago · cadence ?  cli: [age 3h, cadence ?]
//     age ?               cli: [age ?]
//
// `w.read_at == null` AND NOT `!w.read_at`, because `0` is a real epoch second
// and `!0` is `true`. This is `status.py`'s null-never-zero rule arriving at the
// consumer: 07-01 refuses to publish `0` for an unmeasured stamp, and the
// consumer must refuse to read a genuine one as absent.
//
// IT TAKES THE WHOLE MAP rather than a looked-up value. Passing the lookup from
// the row template instead would put `w.retailer` inside an unescaped
// interpolation, and `tests/test_dashboard.py` scans every interpolation on this
// page for exactly that. The lookup belongs in here, not in the template.
// (That test scans the FILE, so it reads comments too — which is why the
// offending form is described here rather than quoted. Measured 2026-08-14: it
// went red on a comment before it ever saw the code, which is the check being
// coarse in the safe direction.)
//
// WHICH CLOCK `nowS` IS, AND THE SKEW THIS ACCEPTS. `read_at` is the daemon
// host's wall clock; `nowS` is the viewer's phone. Both run NTP and the smallest
// threshold in this config is 300 seconds, so the skew is orders of magnitude
// below the comparison. The alternative that cancels it EXACTLY — using
// `d.updated` as `now`, so both stamps come from one clock — is REJECTED: a
// daemon that stopped two days ago would then render every row as one cycle old,
// which is this phase's own failure with the clock pointed the other way, and
// the banner being loud about it does not make the rows honest.
//
// AND WHY THE AGE IS CLAMPED AT 0. A viewer's clock behind the host's yields a
// negative age, and a negative duration in a served surface is the defect
// `status.py` already records for `duration_seconds`. The clamp cannot make a
// stale reading look fresh — it only affects values already below zero — and
// that limit is stated rather than left as a reassurance.
const ageTag = (w, intervals, nowS) => {
  if (w.read_at == null)
    return `<span class="tag age warn" title="nobody recorded when this reading was taken, so its age is not known — this is not a fresh reading, it is an undated one">age ?</span>`;
  const interval = intervals.get(w.retailer) ?? null;
  const age = Math.max(0, nowS - w.read_at);
  if (interval == null)
    return `<span class="tag age warn" title="this reading has a time, but the cadence its retailer is currently on was not published — so how old is too old cannot be answered for this row">${fmtAge(age)} · cadence ?</span>`;
  if (age > interval)
    return `<span class="tag age warn" title="this reading is older than the cadence its own retailer is currently on — both numbers are shown so you can see which threshold the verdict was taken against">${fmtAge(age)} > ${fmtDur(interval)}</span>`;
  return `<span class="tag age" title="this reading is younger than the cadence its own retailer is currently on — the monitor is reading this watch as often as it should">${fmtAge(age)}</span>`;
};

async function tick() {
  let d;
  try {
    d = await (await fetch('status.json?_=' + Date.now())).json();
  } catch {
    document.getElementById('age').textContent = 'status unavailable';
    return;
  }

  // ONE INSTANT PER RENDER, hoisted rather than read twice. No two rows on this
  // page may be judged against two clocks — the same rule `cli._report` states
  // for the printed report and `status.py` states for the producer.
  const nowS = Date.now() / 1000;
  const age = nowS - d.updated;
  document.getElementById('age').textContent = fmtAge(age);

  // A snapshot that has stopped updating is itself a failure worth surfacing.
  const stale = age > 1800;
  const bad = d.retailers.filter(r => !r.ok);
  const banner = document.getElementById('banner');
  if (stale) {
    banner.className = 'banner bad';
    banner.textContent = `Status is ${fmtAge(age)} — the monitor may not be running.`;
  } else if (bad.length) {
    banner.className = 'banner bad';
    banner.innerHTML = bad.map(r => `<strong>${esc(r.retailer)}</strong>: ${esc(r.reason)}`).join('<br>');
  } else {
    banner.className = 'banner ok';
    banner.textContent = 'All detectors verified by control products.';
  }

  // Built ONCE per tick. A cadence is a per-retailer fact and 07-03 publishes it
  // once, in the `retailers` array, precisely so it is not copied onto every one
  // of thirteen rows where the copies could drift.
  const intervals = new Map(d.retailers.map(r => [r.retailer, r.current_interval_seconds]));

  // `not checked` USES THE PLAIN `.tag` CLASS, and that is the decision rather
  // than an oversight. `.tag` dim is an ordinary label, and a retailer that is
  // paced out right now is an ordinary, expected and CORRECT state — it is the
  // politeness rule working. The warning, if there is one, is the AGE, and the
  // age tag beside it is what carries it. Inventing a third visual weight for a
  // state that is not a problem would be inventing a visual language.
  document.getElementById('list').innerHTML = d.watches.map(w => `
    <li>
      <!-- `esc()` HERE FOR THE RULE ABOVE RATHER THAN FOR A KNOWN ATTACKER.
           Until 07-04 the only producer of this key was `r.availability.value`,
           an enum member, so it was one of three literals; 07-04 added a second
           producer that is deliberately not enum-bounded, and this value now
           arrives from `state.json` by the same route `w.read_at` does. It was
           the one interpolation on this page the "escape every value" rule had
           not been applied to, which is that rule not surviving an edit. An
           attribute value is a sink like any other: an unescaped `"` closes it
           and everything after is markup. -->
      <span class="dot ${esc(w.availability)}"></span>
      <div>
        <div>${w.url ? `<a class="name" href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.name)}</a>` : `<span class="name">${esc(w.name)}</span>`}${w.control ? '<span class="tag">control</span>' : ''}${w.degraded ? '<span class="tag degraded" title="lower confidence: a page we rendered ourselves, or a reading lifted out of presentation markup">degraded</span>' : ''}${w.extraction === 'dom' ? '<span class="tag dom" title="read out of the page&#39;s presentation markup rather than the retailer&#39;s own structured feed — a reskin breaks this silently">dom</span>' : ''}${storeTag(w)}${ageTag(w, intervals, nowS)}${w.checked === false ? '<span class="tag" title="nobody read this watch this cycle — its retailer was not due, so the availability and the age beside this are what the monitor last recorded rather than what it just read">not checked</span>' : ''}</div>
        <div class="meta">${esc(w.retailer)} · ${esc(w.detail)}</div>
      </div>
      <span class="price">${w.price != null ? '$' + w.price.toFixed(2) : ''}</span>
    </li>`).join('');
}

tick();
setInterval(tick, 30000);
</script>
</body>
</html>
