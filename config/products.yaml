# bot-y — what to watch.
#
# Adding a product is editing this file. No code, no type unions, no rebuild.

settings:
  # Only count offers sold by the retailer itself. On marketplaces a sold-out
  # product is nearly always "in stock" from resellers at a markup — alerting
  # on those trains you to ignore the notifications.
  first_party_only: true

  # Seconds between passes. A drought lasts weeks; polling every few seconds
  # buys nothing and is what gets an IP blocked.
  interval_seconds: 300

  state_path: state.json

  # OPTIONAL, and genuinely optional: leave it unset and Best Buy still works.
  #
  # Best Buy refuses impersonated HTTP at the connection layer, so its default
  # path here is a real browser (rung 3), and every reading from it is flagged
  # DEGRADED. A key from https://developer.bestbuy.com/ upgrades the same
  # watches to the official API, which is more reliable and not degraded — but
  # signup needs manual approval and rejects free email domains, so it can
  # never be what a fresh clone depends on. Needs `pip install -e '.[browser]'`
  # and a Chrome/Chromium binary; see BOTY_BROWSER_PATH in the README.
  bestbuy_api_key: ${BESTBUY_API_KEY}

# Apprise URLs. Keep the secrets in the environment, not in this file.
#   tgram://<bot-token>/<chat-id>     ntfy://<topic>     discord://<id>/<token>
notify:
  - ${BOTY_NOTIFY_URL}

watches:
  # ---- what we actually want -------------------------------------------
  - name: Pokémon GO Plus +
    retailer: gamestop
    target: https://www.gamestop.com/consoles-hardware/nintendo-switch/gaming-accessories/controllers/products/pokemon-go-plus-plus/20003961.html
    max_price: 80          # MSRP is $54.99; anything near $140 is a flip

  - name: Pokémon GO Plus +
    retailer: walmart
    target: https://www.walmart.com/ip/Pok-mon-GO-Plus-for-Nintendo-Switch/1203950273
    max_price: 80

  # The one that matters most. Nintendo MAKES this, lists it at $54.99 — MSRP to
  # the cent — and has no marketplace, so neither flipper defence has anything to
  # defend against here. The ceiling stays on anyway: it costs nothing and it is
  # the independent second line if the seller filter ever regresses.
  - name: Pokémon GO Plus +
    retailer: nintendo
    target: https://www.nintendo.com/us/store/products/pokemon-go-plus-plus-112387/
    max_price: 80

  # ---- controls: known-good products that prove the detector works ------
  # If one of these stops reading in-stock, the detector is broken and you
  # get told. Without them, a stale parser reports "out of stock" forever
  # and you never hear anything again — which looks exactly like a drought.
  - name: CONTROL — PS5 console
    retailer: gamestop
    target: https://www.gamestop.com/consoles-hardware/playstation-5/consoles/products/playstation-5-console/11108140.html
    control: true

  # A grocery staple is the ideal control: sold by Walmart itself, restocked
  # daily, and never the subject of a marketplace buy-box fight. Do not use a
  # console here — on Walmart those are frequently held by resellers, so an
  # out-of-stock reading would be correct and you would chase a phantom bug.
  - name: CONTROL — Great Value whole milk
    retailer: walmart
    target: https://www.walmart.com/ip/Great-Value-Whole-Vitamin-D-Milk-Gallon-Plastic-Jug-128-Fl-Oz/10450114
    control: true

  # ---- Best Buy ---------------------------------------------------------
  # `target` is a SKU, not a URL, and that is deliberate: the same entry has to
  # serve both of Best Buy's rungs. Without BESTBUY_API_KEY a real browser
  # reads the page (flagged DEGRADED); with one, the official Products API
  # reads the same SKU and the flag drops. Neither path can be given a product
  # URL, because Best Buy's live URLs are `/product/<slug>/<ID>` where <ID> is
  # an opaque token that cannot be derived from the SKU — `bestbuy_product_url`
  # goes through SKU search instead, which redirects.
  #
  # There is NO Best Buy watch for the GO Plus + itself, and that is a finding
  # rather than an omission: Best Buy does not appear to carry the product.
  # Searches for it return gift cards and unrelated Switch titles, and the SKU
  # this repo used to carry for it (6577129) resolves to nothing. Watching a
  # page that does not exist would produce a permanent UNKNOWN and a permanent
  # health warning. See docs/retailer-evidence.md.
  #
  # An evergreen first-party catalogue title, restocked routinely and never a
  # buy-box fight. Not the house-brand cable the rule would suggest: that page
  # is one of the ones Best Buy reproducibly refuses to render.
  - name: CONTROL — Pokémon Let's Go, Pikachu! (Switch)
    retailer: bestbuy
    target: "6216393"
    control: true

  # ---- Nintendo ---------------------------------------------------------
  # `target` is a plain URL, the opposite of Best Buy above, and deliberately so.
  # Nintendo publishes a 36,530-entry store sitemap and its product URLs are
  # stable and derivable from it, so there is nothing to resolve; Best Buy's SKU
  # indirection is a workaround for a problem this retailer does not have.
  #
  # No adapter code exists for Nintendo and none is needed. Its pages carry
  # ordinary schema.org Product markup that `check_html` already reads — the
  # whole of its support is one FIRST_PARTY line and these two watches.
  #
  # A replacement cable: first-party by construction, restocked routinely, not a
  # console and not a limited drop. Reserve candidate if it is ever discontinued
  # is the AC adapter (`ac-adapter-104900`).
  - name: CONTROL — Nintendo HDMI cable
    retailer: nintendo
    target: https://www.nintendo.com/us/store/products/hdmi-cable-104947/
    control: true

  # ---- Pokémon Center: NOT here, on purpose -----------------------------
  # There is no `retailer: pokemoncenter` entry and that is a finding, not a gap.
  # Pokémon Center stocks the GO Plus + (/product/715e10557/pokemon-go-plus), so
  # a watch here would look entirely plausible — and would never read anything.
  # Its product pages are Imperva-walled at rung 1 (HTTP 200 "Pardon Our
  # Interruption") and at rung 3 (headless Chrome, refused twice), and its own
  # robots.txt forbids the API endpoints that would answer the stock question.
  # Rung 4, with the evidence in docs/retailer-evidence.md and QUESTIONS.md.
  #
  # It is worth retrying: the homepage reads fine at rung 1, so the wall is
  # narrower than a site-wide policy.

  # ---- transition controls: products SUPPOSED to change state ---------------
  # The controls above prove "can we still read this page". These prove "do we
  # still NOTICE when the page changes" — a different question, and the one the
  # detector actually exists to answer.
  #
  # Nothing in the 36-test suite caught the bug where every restock after the
  # first was silently dropped: the pages read perfectly, only the transition
  # was lost. An always-in-stock control can never catch that, because it never
  # transitions. These can.
  #
  # Deliberately NOT `control: true`. They are EXPECTED to read OUT_OF_STOCK
  # regularly, and `make verify` must never fail because the market moved.
  # `control_check.py` and `assess_health()` both filter on `control`, so a
  # watch without it cannot fail the gate whatever it reads.
  #
  # No `max_price` on purpose: the ceiling gates `alertable`, which gates the
  # notification. Leaving it off means a transition produces a real push, so the
  # whole chain — parse, state, edge detection, Apprise — is proved end to end,
  # not just the part that writes state.json. If the pings get noisy, set
  # `max_price: 0` and they go quiet while still recording state.
  #
  # GameStop only. Walmart cannot supply one: its flappy listings are held by
  # marketplace resellers (so they'd flap on reseller churn, not real restocks)
  # and its first-party listings are evergreen staples that never move. GameStop
  # publishes exactly one first-party ld+json offer per page — no buy-box fight.

  - name: TRANSITION — Pitch Black Booster Bundle
    retailer: gamestop
    target: https://www.gamestop.com/toys-games/trading-cards/products/pokemon-trading-card-game-pitch-black-booster-bundle/20034822.html

  - name: TRANSITION — Ascended Heroes Mini Tin
    retailer: gamestop
    target: https://www.gamestop.com/toys-games/trading-cards/products/pokemon-trading-card-game-ascended-heroes-mini-tin-styles-may-vary/20030566.html

  # Currently OUT of stock — the complement to the two above, so we observe an
  # OUT→IN edge without waiting for the in-stock pair to sell through first.
  - name: TRANSITION — Mega Evolution Booster Bundle
    retailer: gamestop
    target: https://www.gamestop.com/toys-games/trading-cards/products/pokemon-trading-card-game-mega-evolution-booster-bundle/20023793.html
