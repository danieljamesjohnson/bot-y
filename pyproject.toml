[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-y"
version = "1.0.0"
description = "Self-hosted restock monitor for big retailers — TLS-impersonation fetching, structured stock data, and control products that catch broken detectors instead of failing silently."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639, and every clause of it measured against setuptools 83.0.0 rather
# than taken from the PEP.
#
# The old form here was `license = { text = "MIT" }`. Preparing metadata with
# it printed `SetuptoolsDeprecationWarning: `project.license` as a TOML table
# is deprecated`, naming the replacement — a plain SPDX expression string, plus
# `project.license-files` — and a removal date: 2027-02-18, after which builds
# using the table form stop being supported.
#
# The string form emits `License-Expression: MIT` and `License-File: LICENSE`,
# places the file at `bot_y-<v>.dist-info/licenses/LICENSE`, and prints no
# warning at all. Both keys need setuptools 77.0.0 or newer, which is why the
# `[build-system]` floor above moved 68 -> 77. That widens nothing: build
# isolation already resolved the newest setuptools under `>=68` — 83.0.0 today
# — so the floor now states what actually builds.
#
# There is deliberately no `License :: OSI Approved :: MIT License` entry in
# `classifiers` below. Alongside an SPDX expression it is not a style warning:
# setuptools raises `InvalidConfigError: License classifiers have been
# superseded by license expressions (see PEP 639)` and the build fails outright.
#
# AND THE PART THAT MATTERS MOST: setuptools does NOT check that a
# `license-files` target exists. With this key declared and no `LICENSE` on
# disk the build succeeds silently, still emits `License-Expression: MIT`,
# emits no `License-File`, and writes no `licenses/` directory. The build is
# not the gate. That is exactly how this repository stayed public for three
# phases declaring MIT here and in README.md while `git ls-files` matched
# nothing for `licen*` and the GitHub API reported `license: None`. The gate is
# `tests/test_packaging_metadata.py`, which reads this declaration and that
# file and fails when they disagree in either direction.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Johnson" }]
keywords = ["restock", "monitor", "stock", "scraping", "notifications"]

# Every classifier is a claim made to everyone who installs this, so each one
# here is backed by something in the tree and the backing is named. The
# temptation with this list is to pad it; a padded list is a list of things
# nobody checked.
#
#   Environment :: Console          <- [project.scripts] boty = "boty.cli:main"
#   Intended Audience :: End Users  <- README.md:3 — a self-hosted tool a person
#                                      runs, not a library for other code
#   Operating System :: POSIX ::    <- deploy/boty.service and
#     Linux                            deploy/boty-web.service are the only
#                                      install instructions this repo ships.
#                                      Narrower than the truth may be, and
#                                      deliberately so: `OS Independent` would
#                                      claim Windows and macOS, and nothing here
#                                      has ever run on either.
#   Programming Language :: 3       <- requires-python = ">=3.10"
#   Programming Language :: 3.10    <- the declared floor, which CI pins. 3.11,
#                                      3.12 and 3.13 are absent because nothing
#                                      in this tree tests them, and a version
#                                      classifier is a claim that something did.
#   Topic :: System :: Monitoring   <- what the thing is
#
# `Development Status :: 5 - Production/Stable` arrived with the 1.0.0 bump, and
# it is FIRST in the list because that is where alphabetical order puts it —
# 04-02 left this list sorted and the sort is the only thing keeping it readable.
#
# 04-02 deferred this entry deliberately, on the grounds that development status
# is a statement about the version and the version was 0.1.0. There is now a
# version to make it about, so the choice has to be made rather than deferred
# again. `4 - Beta` was 04-02's placeholder guess and it is REJECTED in writing:
# tagging 1.0.0 while classifying the package Beta is exactly the
# asserted-versus-real disagreement this phase exists to close, and it leaves a
# reader to decide which of the two numbers to believe.
#
# What backs `5 - Production/Stable` is in the tree rather than in ambition:
# `make verify` has been the phase gate since Phase 1 and every phase states its
# success criteria as its exit code; the control-product mechanism catches a
# BROKEN DETECTOR rather than reporting a confident false verdict; `deploy/`
# ships two systemd units; and this monitor has run as a service against six
# live retailers, publishing per-cycle status, for the whole of Phase 3.
#
# TWO ABSENCES, each deliberate:
#   * No `License ::` classifier. Measured, not stylistic: alongside the SPDX
#     expression above setuptools raises InvalidConfigError and the build fails.
#   * No `Typing :: Typed`. There is no `boty/py.typed` marker in the tree, so
#     the classifier would advertise a typing contract no installed consumer can
#     act on — mypy downstream would still treat `boty` as untyped. Adding the
#     marker is a real change with real consequences and it belongs in its own
#     commit.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "curl_cffi>=0.7",   # browser TLS/JA3 impersonation — the load-bearing dep
    "PyYAML>=6.0",
    "apprise>=1.7",     # ~100 notification services behind one URL syntax
]

[project.optional-dependencies]
# Everything needed to run `make verify`. Kept out of the runtime deps so a
# deployed monitor does not pull a test framework onto the box.
dev = [
    "pytest>=8.0",
    # 2.x, not the original >=1.8: mypy 2 is meaningfully stricter by default,
    # so a contributor resolving 1.x would run a WEAKER check than the one this
    # config was verified against and get a green that means less than ours.
    "mypy>=2.0",
    # BOTH ends are deliberate, and that is the opposite shape to the mypy line
    # two above it. The floor is the version every measurement in [tool.ruff.lint]
    # below was taken against. The ceiling exists because the selection is by
    # PREFIX: ruff lands new rules in preview and stabilises them in minor
    # releases, so a 0.17 that stabilises one more `RUF` or `B` rule can turn a
    # green tree red with nobody having touched a line of code — and `make verify`
    # is the number every phase of this project states its success criteria in.
    # Widening this range is therefore a deliberate edit made with the findings in
    # front of you, not something a resolver does on a contributor's laptop.
    #
    # It belongs in `dev` because this extra's own comment above says it is
    # everything needed to run `make verify`, which is now true of ruff.
    #
    # Supply-chain note (audited 2026-08-04, in the same form as the `nodriver`
    # note under the `browser` extra below): PyPI `ruff` 0.16.1, licence MIT,
    # publisher Astral Software Inc. — also the publisher of `uv` and `rye`.
    # Declared Repository github.com/astral-sh/ruff, Documentation
    # docs.astral.sh/ruff, Changelog under the same repo. That repo at audit time:
    # 49,061 stars, created 2022-08-09, last push 2026-08-04, not archived, MIT.
    # Cadence: 417 releases on PyPI, first 2022-08-27, latest 2026-07-30 — six
    # continuous years, not a burst. Typosquat neighbours checked by name against
    # the PyPI JSON API: `rufff`, `ruf`, `ruff-py`, `python-ruff`, `ruff2` and
    # `py-ruff` all return 404; the only adjacent name that exists is `ruff-lsp`,
    # which declares github.com/astral-sh/ruff-lsp — the same publisher.
    # Dependency surface: `requires_dist` is null, so `pip install ruff` adds
    # EXACTLY ONE package and no transitive tree, which is what makes it
    # compatible with this project's small-dependency rule. Blast radius is
    # bounded twice over: it is a `dev`-only extra and never a runtime
    # dependency, and it is a compiled binary that runs at lint time — nothing
    # `import boty` ever touches.
    "ruff>=0.16,<0.17",
]

# Rung 3 of the escalation ladder: a real browser, for the one retailer that
# refuses impersonated HTTP at the connection layer. Optional for the same
# reason `dev` is — a deployed monitor, or a contributor who only touches the
# HTTP retailers, must not be forced to pull a browser driver onto the box.
# `boty.browser` imports it lazily so `import boty` never touches it.
#
#   .venv/bin/pip install -e '.[browser]'
#
# Supply-chain note (audited 2026-08-02, approved by the maintainer before
# install): PyPI `nodriver` 0.50.3 declares Homepage/Source/Bug Reports all
# pointing at github.com/UltrafunkAmsterdam/nodriver — 4.6k stars, 43 releases
# since 2024-02, last push same day as the last release. It is the upstream
# successor to undetected-chromedriver. No typosquat neighbours exist on PyPI
# (`no-driver`, `nodriver-py`, `nodrivers`, `nodriver2`, `py-nodriver` are all
# 404). It is AGPL-3.0 while this project is MIT: keeping it an *optional*
# dependency the user installs themselves — never vendored, never redistributed
# — is what keeps that distinction clean.
browser = ["nodriver>=0.38"]

[project.urls]
# 04-02 left a note here instead of a `Changelog` key, because CHANGELOG.md did
# not exist and a metadata URL that 404s is a false claim shipped to every
# installer. The file lands in the same commit as this line, so the claim
# becomes true at the moment it is made — and `scripts/release_check.py` asserts
# that this URL's repository-relative path resolves to a file that exists, so it
# cannot silently rot back into a 404.
Changelog = "https://github.com/danieljamesjohnson/bot-y/blob/main/CHANGELOG.md"
Homepage = "https://github.com/danieljamesjohnson/bot-y"
Source = "https://github.com/danieljamesjohnson/bot-y"
Issues = "https://github.com/danieljamesjohnson/bot-y/issues"
Documentation = "https://github.com/danieljamesjohnson/bot-y#readme"

[project.scripts]
boty = "boty.cli:main"

[tool.setuptools.packages.find]
include = ["boty*"]

[tool.mypy]
# Committed so `mypy` with no arguments checks the same thing for everyone.
# A check that only passes with the right invocation flags is a check that
# quietly stops being run.
python_version = "3.10"
# `scripts` is included on purpose: control_check.py and mutation_check.py are
# what `make verify` trusts to tell the truth about everything else. Leaving the
# verifier itself unchecked would put the one thing nobody re-reads outside the
# net that guards the code it judges.
files = ["boty", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Without these two, non-strict mypy does not check the body of an unannotated
# function AT ALL — it just skips it. So the whole package would pass this check
# with zero annotations, and the next contributor to add a bare `def` would get
# a silent free pass while the badge stayed green. That is the same shape of
# failure as a detector reporting out-of-stock forever: green, and meaningless.
# These make "boty carries type hints" enforced rather than a one-time snapshot.
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Deliberately NOT strict. The goal is catching real None-handling errors in an
# ~1000-line codebase — the class of bug that produces a wrong stock verdict
# rather than a crash — not winning a strictness contest. An over-strict config
# that contributors immediately start `# type: ignore`-ing is worse than a
# moderate one they respect.

# These ship without complete type stubs. Their absence says nothing about our
# code, and treating it as an error would train everyone to ignore mypy output.
[[tool.mypy.overrides]]
module = ["curl_cffi.*", "apprise.*", "yaml.*", "nodriver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra surfaces skipped/xfailed tests in the summary. A test that quietly stops
# running is the same class of silent failure this project exists to prevent.
addopts = "-ra"

[tool.ruff]
# The direct analogue of `[tool.mypy] files` above, and committed for the same
# reason: so a bare `ruff check` from the repo root judges the same 35 files for
# everyone. `make lint`, a contributor's editor and CI cannot silently check
# different sets, and a check that only passes with the right invocation flags is
# a check that quietly stops being run.
#
# `tests/` is included here while mypy excludes it, on purpose. mypy's job is the
# shipped code's type contract, so tests are outside its remit. But the gate tests
# in `tests/` are the things `make verify` TRUSTS to tell the truth about
# everything else — leaving them unlinted would put the verifier outside the net
# that guards the code it judges, which is the same sentence `[tool.mypy] files`
# already makes about `scripts/`.
include = ["boty/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

# `target-version` is deliberately NOT set. Ruff infers it from
# `requires-python = ">=3.10"` above, so the floor stays declared in exactly one
# place; duplicating it into a second key is how the two drift. Verified: the
# inferred run and an explicit `--target-version py310` run produce
# byte-identical output.

[tool.ruff.lint]
# WHAT IS SELECTED, and what is deliberately not. Each exclusion below is a
# measurement rather than a preference, recorded with its number so that widening
# the selection is a decision someone has to argue with rather than a default.
#
# Selected: `F` (pyflakes), `E4`/`E7`/`E9` (ruff's own default pycodestyle
# subset), `W`, `I` (import order), `UP` (pyupgrade), `B` (bugbear), `SIM`, `C4`,
# `RUF`. Measured 2026-08-04 against ruff 0.16.1: this selection produced 20
# findings over the tree, 10 safe-autofixable and 9 needing `--unsafe-fixes`. The
# `E4`/`E7`/`E9` split rather than a bare `E` is ruff's own default, and it exists
# precisely because `E5` — line length — is contentious. Here it is more than
# contentious:
#
# * `E501` IS NOT SELECTED. Selecting `E` wholesale produced 497 findings and
#   every single one of them was `E501`. Measured separately: 106 lines in
#   `boty/`, `scripts/` and `tests/` exceed 100 characters and the longest is 473.
#   They are the prose comment blocks and docstrings carrying this project's
#   recorded decisions and its measurements — the AGPL `nodriver` audit above, the
#   mypy-strictness rationale above that, the `MARKETPLACES` absence-is-a-claim
#   block — several quoted verbatim from `docs/` and `.planning/`. Reflowing them
#   to satisfy a length rule would rewrite the records, and a record that a tool
#   rewrote is not a record. Line length here is a judgement the reviewer makes
#   and the linter does not.
#
# * `ruff format` IS NOT ADOPTED, and there is deliberately no
#   `[tool.ruff.format]` table and no `format` target in the Makefile. Measured:
#   `ruff format --check` reports 32 of 36 files would be reformatted. Doing that
#   immediately before a 1.0.0 tag rewrites `git blame` across the whole codebase
#   — every line of every decision in this repo starts pointing at one formatting
#   commit — and buys a reviewer nothing they asked for. Lint, not format.
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

# `external` names rule codes owned by ANOTHER tool, and it is what resolves the
# `RUF100` coupling below. Measured both directions on 2026-08-04.
#
# Ruff does not raise `E402` for module-level imports that follow a `sys.path`
# mutation; flake8 and pycodestyle do. Verified against a two-file probe: a plain
# out-of-order import is flagged by both, the same import after
# `sys.path.insert(...)` is flagged only by flake8. So the seven `# noqa: E402`
# directives in `scripts/control_check.py` and `scripts/evidence_check.py` are
# CORRECT for the tool a contributor may reach for and inert under ruff — which
# makes `RUF100` report all seven as unused, with a SAFE autofix. A plain
# `ruff check --fix` therefore deletes them, silently re-introducing a
# pycodestyle warning for everyone not using ruff. Deleting a directive to reach
# zero is resolving a finding by throwing away the thing it was pointing at.
#
# The second half of the measurement is what makes this a scoping fix rather than
# a suppression: with `external` set, a file containing a genuine `E402` is STILL
# reported. `external` changes what `RUF100` considers unused; it does not switch
# `E402` off.
external = ["E402"]

# A narrowing of RUF001/RUF002, not a deselection: every other confusable is
# still flagged. The rule exists to catch homoglyph smuggling — Cyrillic and
# Greek lookalikes inside identifiers and literals. All three findings it
# produced here were EN DASHes inside docstrings and strings that quote
# measurements, e.g. `1.9–3.2 MB each` in `check_amazon`'s docstring, which
# records a live probe result. Allowing the two dashes this project's prose
# actually uses keeps the rule aimed at smuggling instead of at typography.
allowed-confusables = ["–", "—"]
